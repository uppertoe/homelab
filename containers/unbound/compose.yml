# https://github.com/klutchell/unbound-docker
services:
  # Enable CacheDB Module with Redis backend
  redis:
    image: redis:latest
    container_name: redis
    hostname: redis
    restart: unless-stopped
    volumes:
      - redis:/data
    networks:
      - private-net
  
  unbound:
    container_name: unbound
    image: "klutchell/unbound:latest"
    networks:
      private-net:
    volumes:
      - "${PROJECT_PATH}/${CONFIG}/unbound:/etc/unbound/custom.conf.d"
    restart: unless-stopped
    healthcheck:
      # Use the drill wrapper binary to reduce the exit codes to 0 or 1 for healthchecks
      test: ['CMD', 'drill-hc', '@127.0.0.1', 'dnssec.works']
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 30s
    depends_on:
      - redis

volumes:
  redis:
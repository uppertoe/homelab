server:
  # Listen on container interfaces so Pi-hole can reach us
  interface: 0.0.0.0
  interface: ::           # if you’ve enabled IPv6 in Docker
  port: 53

  do-ip4: yes
  do-ip6: yes             # ok to keep on; harmless if v6 isn’t routed
  do-udp: yes
  do-tcp: yes
  incoming-num-tcp: 64
  outgoing-num-tcp: 64
  so-rcvbuf: 1m
  so-reuseport: yes

  # Recursive resolver hygiene & DNSSEC
  module-config: "validator cachedb iterator"
  auto-trust-anchor-file: root.key      # you chose this path; ensure the dir is writable
  harden-glue: yes
  harden-dnssec-stripped: yes
  use-caps-for-id: no
  qname-minimisation: yes
  edns-buffer-size: 1232
  prefetch: yes
  prefetch-key: yes

  # Threads (Pi 5 can handle 2+)
  num-threads: 1

  # Private address ranges (no upstream PTRs)
  private-address: 192.168.0.0/16
  private-address: 169.254.0.0/16
  private-address: 172.16.0.0/12
  private-address: 10.0.0.0/8
  private-address: fd00::/8
  private-address: fe80::/10
  private-address: 192.0.2.0/24
  private-address: 198.51.100.0/24
  private-address: 203.0.113.0/24
  private-address: 255.255.255.255/32
  private-address: 2001:db8::/32

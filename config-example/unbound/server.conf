server:
  do-ip4: yes
  do-ip6: yes
  do-udp: yes
  do-tcp: yes
  incoming-num-tcp: 64
  outgoing-num-tcp: 64

  module-config: "validator cachedb iterator"
  auto-trust-anchor-file: root.key
  harden-dnssec-stripped: yes
  val-clean-additional: yes
  edns-buffer-size: 1232
  qname-minimisation: yes
  prefetch: yes
  prefetch-key: yes
  so-reuseport: yes
